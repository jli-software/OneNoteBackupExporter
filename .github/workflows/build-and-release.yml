name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          [xml] $project = Get-Content OneNoteExporter.csproj
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1

          if (-not $projectVersion) {
            throw "No <Version> was found in OneNoteExporter.csproj."
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
              throw "Release tags must use semantic versioning, for example v1.2.0."
            }

            $version = $Matches.version
            if ($version -ne $projectVersion) {
              throw "Tag version $version does not match project version $projectVersion."
            }
          }
          else {
            $version = $projectVersion
          }

          "number=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore dependencies
        run: dotnet restore OneNoteExporter.csproj --runtime win-x64

      - name: Publish self-contained application
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: |
          dotnet publish OneNoteExporter.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output build `
            -p:PublishSingleFile=false `
            "-p:Version=$env:APP_VERSION"

      - name: Compile installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $isccCandidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw 'Inno Setup compiler was not found after installation.'
          }

          & $iscc "/DMyAppVersion=$env:APP_VERSION" innosetup.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item "artifacts\OneNoteBackupExporter_Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneNoteBackupExporter-Windows-x64
          path: |
            artifacts/OneNoteBackupExporter_Setup.exe
            artifacts/OneNoteBackupExporter_Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: OneNoteBackupExporter-Windows-x64
          path: artifacts

      - name: Create release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(artifacts/*)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "OneNote Backup Exporter $TAG" \
              --generate-notes
          fi
